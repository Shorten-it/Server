upstream url_service {
    least_conn;
    server url-service:8081;
}

upstream redirect_service {
    least_conn;
    server redirect-service:8082;
}

server {
    listen 80;

    # URL 생성 → url-service
    location = /api/v1/url/shorten {
        proxy_pass http://url_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # URL 삭제 → url-service (DELETE만)
    location ~ ^/api/v1/url/([^/]+)$ {
        limit_except GET {
            proxy_pass http://url_service;
        }
        proxy_pass http://redirect_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # URL 프리뷰 → redirect-service
    location ~ ^/api/v1/url/([^/]+)/preview$ {
        proxy_pass http://redirect_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 헬스체크
    location /actuator/health/url-service {
        proxy_pass http://url_service/actuator/health;
    }

    location /actuator/health/redirect-service {
        proxy_pass http://redirect_service/actuator/health;
    }
}
