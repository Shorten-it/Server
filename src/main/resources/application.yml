spring:
  application:
    name: Shortly
  datasource:
    url: "jdbc:postgresql://localhost:5432/url_shortener"
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: "jdbc:postgresql://db:5432/url_shortener"
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: redis
      port: 6379


